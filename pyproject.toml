[tool.ruff]
# Keep in sync with the oldest Python the code runs under:
# the LaunchAgent and CLI all use the macOS system /usr/bin/python3 (3.9).
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle; F: pyflakes (unused imports, undefined names)
# I: isort (import ordering); UP: pyupgrade (modernize, py39-aware)
# B: flake8-bugbear (bug-prone patterns); RUF: ruff-specific checks
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
# E501 (line too long) is off because `ruff format` already enforces the line-length.
ignore = ["E501"]

[tool.mypy]
# The code must still run on Python 3.9+, but mypy 2.x no longer supports
# type-checking against a 3.9 target and refuses to run, so the effective
# floor here is 3.10. Syntax compatibility with the 3.9 runtime is still
# enforced by ruff's target-version = "py39" above, and the codebase only
# uses PEP 585 builtin generics, which are valid at runtime on 3.9.
python_version = "3.10"
# Flags # type: ignore comments that are no longer needed, so they don't rot.
warn_unused_ignores = true